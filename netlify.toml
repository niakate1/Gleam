# ============================================================================
# Gleam — configuration Netlify
#
# POURQUOI CE FICHIER EXISTE
#
# Le réglage qui nous a fait chercher pendant des heures — « le dossier publié
# est public/ » — n'existait que dans le tableau de bord Netlify. Invisible
# depuis le dépôt, invisible dans l'historique, invisible pour quiconque
# reprendrait le projet.
#
# Ce fichier le rend explicite et versionné. Quelqu'un qui ouvre le dépôt dans
# six mois comprend en dix secondes comment le site est servi.
#
# C'est la vraie leçon : ce n'est pas Netlify contre GitHub Pages qui posait
# problème, c'est un réglage important caché dans une interface.
#
# Placer ce fichier à la RACINE du dépôt, pas dans public/.
# ============================================================================

[build]
  # Le dossier réellement publié. Netlify sert son contenu comme s'il était la
  # racine du site : public/index.html devient gleam-app.fr/index.html
  publish = "public"

  # Aucune commande de compilation : le site est en HTML, CSS et JavaScript
  # directs, sans étape de construction. C'est volontaire et cela vous épargne
  # toute une catégorie de pannes.
  command = ""


# ─────────────────────────────────────────────────────────────────────────────
# LES FICHIERS QUI NE DOIVENT PAS ÊTRE SERVIS
#
# `public/test.html` contient des identifiants de comptes en clair — adresses
# et mots de passe. Netlify publie le dossier `public/` tel quel : le fichier
# est donc accessible à quiconque connaît son adresse.
#
# CETTE RÈGLE NE REMPLACE PAS SA SUPPRESSION
#
# Elle empêche d'y accéder, elle n'efface rien. Le fichier reste dans le dépôt,
# et dans l'historique Git. Ces mots de passe sont à considérer comme
# compromis : changez-les, supprimez le fichier, purgez l'historique.
#
# Cette règle est un garde-fou pour aujourd'hui, pas une solution.
#
# LE 404 EST DÉLIBÉRÉ
#
# Un 403 confirmerait que le fichier existe. Un 404 ne dit rien.
# ─────────────────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/test.html"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/test"
  to = "/index.html"
  status = 404
  force = true

# Les fichiers de développement et de configuration, s'ils venaient à se
# retrouver dans `public/`. Une liste d'interdits laisse toujours passer le
# prochain fichier ajouté — mais ici, contrairement au serveur, on ne peut pas
# énumérer ce qui est autorisé : le site sert des pages, pas une liste fermée.
[[redirects]]
  from = "/*.env"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.sql"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true


# ─────────────────────────────────────────────────────────────────────────────
# Le service worker
#
# Deux règles indispensables, sans lesquelles les notifications ne peuvent pas
# fonctionner de façon fiable.
# ─────────────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/sw.js"
  [headers.values]
    # Un navigateur REFUSE catégoriquement d'enregistrer un service worker qui
    # n'est pas servi en JavaScript. Netlify le fait correctement d'après
    # l'extension, mais l'écrire noir sur blanc évite toute surprise.
    Content-Type = "text/javascript; charset=utf-8"

    # Jamais de cache sur ce fichier. Un service worker mis en cache continue
    # de tourner dans sa version périmée pendant des jours, et vos corrections
    # n'atteignent jamais les téléphones déjà installés.
    Cache-Control = "public, max-age=0, must-revalidate"

    # Autorise le service worker à contrôler tout le site, et pas seulement son
    # propre dossier. Inutile tant qu'il est à la racine du dossier publié,
    # mais c'est un filet si l'organisation des fichiers change un jour.
    Service-Worker-Allowed = "/"


# ─────────────────────────────────────────────────────────────────────────────
# Les pages HTML
#
# Toujours revalidées : c'est ce qui garantit qu'une correction déployée arrive
# immédiatement chez vos utilisateurs, sans qu'ils aient à vider leur cache.
# ─────────────────────────────────────────────────────────────────────────────
# ── CET EN-TÊTE RESTE JUSTE, ET NE GÊNE PAS LE SERVICE WORKER ────────────────
# `must-revalidate` s'adresse au cache du NAVIGATEUR. Le service worker, lui,
# intercepte la requête AVANT que ce cache n'entre en jeu : il sert sa propre
# copie immédiatement, puis rafraîchit en arrière-plan.
#
# Les deux mécanismes se complètent : le service worker donne l'affichage
# instantané, cet en-tête garantit qu'un utilisateur sans service worker —
# première visite, navigateur ancien — reçoit toujours la dernière version.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"


# ─────────────────────────────────────────────────────────────────────────────
# Les icônes
#
# Elles ne changent quasiment jamais : un an de cache évite de les retélécharger
# à chaque visite. Si vous en modifiez une, changez son nom de fichier.
# ─────────────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


# ─────────────────────────────────────────────────────────────────────────────
# Sécurité — s'applique à tout le site
# ─────────────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Empêche l'affichage de Gleam dans un cadre sur un autre site, technique
    # utilisée pour faire cliquer un utilisateur sans qu'il s'en rende compte.
    X-Frame-Options = "SAMEORIGIN"

    # Interdit au navigateur de deviner le type d'un fichier. C'est cette
    # devinette qui pousse parfois à exécuter comme script un fichier qui ne
    # devrait pas l'être.
    X-Content-Type-Options = "nosniff"

    # Les sites vers lesquels vos utilisateurs cliquent ne reçoivent que le
    # domaine, jamais l'adresse complète — laquelle peut contenir un
    # identifiant de demande.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Aucune page ne demande la caméra ni le micro. La géolocalisation reste
    # autorisée : elle sert à la zone d'intervention des prestataires et à la
    # confirmation d'arrivée.
    Permissions-Policy = "camera=(), microphone=(), payment=(), geolocation=(self)"

    # Impose HTTPS pendant un an. À n'activer qu'une fois le certificat en
    # place et le domaine stabilisé — ce que Netlify fait automatiquement.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"


# ─────────────────────────────────────────────────────────────────────────────
# L'ancienne adresse
#
# Les personnes ayant installé Gleam depuis gleam-app.fr/public/ conservent ce
# raccourci sur leur écran d'accueil. Cette redirection leur évite une page
# morte. À supprimer dans quelques semaines.
# ─────────────────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/public/*"
  to = "/:splat"
  status = 301
  force = true


# ─────────────────────────────────────────────────────────────────────────────
# CE QU'IL NE FAUT SURTOUT PAS AJOUTER
#
# La redirection attrape-tout des applications monopage :
#
#     [[redirects]]
#       from = "/*"
#       to = "/index.html"
#       status = 200
#
# Elle renverrait index.html pour TOUTE adresse inconnue — y compris /sw.js,
# qui serait alors servi en text/html et refusé par le navigateur. C'est la
# panne la plus fréquente sur ce sujet.
#
# Gleam n'en a de toute façon aucun besoin : la navigation se fait par
# fragments d'URL (#devis, #demande-123), que le serveur ne voit jamais.
# ─────────────────────────────────────────────────────────────────────────────
