<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Gleam — Administration</title>
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   GLEAM — CONSOLE D'ADMINISTRATION
   Les jetons de l'application (couleurs, typographies, rayons) : la console
   supervise le produit, elle doit lui ressembler.
   ============================================================================ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --p:#0E5A63; --p-profond:#062E34; --p-medium:#0A4750; --brume:#E3F1F2; --brume-2:#CFE6E8;
  --bg:#F4F7F7; --surface:#FFFFFF; --surface-alt:#EEF3F3;
  --border:#DCE5E5; --border-fort:#BECCCC;
  --text:#14132B; --text-2:#44585C; --gray:#56696C;
  --vert:#0A7A54; --vert-clair:#E3F7EF; --rouge:#B42318; --rouge-clair:#FDEDEC;
  --ambre:#8F5C06; --ambre-clair:#FDF4E3; --indigo:#3C47B5; --indigo-clair:#EEF0FD;
  --ombre-1:0 1px 2px rgba(20,19,43,.06);
  --ombre-2:0 8px 28px rgba(6,46,52,.10), 0 1px 3px rgba(6,46,52,.06);
  --ombre-3:0 24px 64px rgba(6,46,52,.22);
  --anneau:0 0 0 3px rgba(14,90,99,.30);
  --r-1:8px; --r-2:12px; --r-3:18px;
  --ease:cubic-bezier(.16,1,.3,1);
  --barre:248px;
}
@media (prefers-color-scheme: dark){
  :root{
    --p:#4FB3B8; --brume:#103238; --brume-2:#16424A;
    --bg:#080F11; --surface:#111C1F; --surface-alt:#18272B;
    --border:#25383D; --border-fort:#365055;
    --text:#E9EFF0; --text-2:#B6C6C8; --gray:#96A9AC;
    --vert:#34D399; --vert-clair:#10352A; --rouge:#F87171; --rouge-clair:#3B1A1A;
    --ambre:#FBBF4C; --ambre-clair:#3A2C0C; --indigo:#A5B0FF; --indigo-clair:#1E2347;
    --anneau:0 0 0 3px rgba(79,179,184,.40);
  }
}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--p)}
:focus-visible{outline:none;box-shadow:var(--anneau);border-radius:6px}
.masque{display:none!important}
.serif{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-.01em}
.petit{font-size:12.5px;color:var(--gray)}
.fort{font-weight:700}
.num{font-variant-numeric:tabular-nums}
svg.lucide{width:16px;height:16px;stroke-width:2;flex-shrink:0}

/* ── Connexion ──────────────────────────────────────────────────────────── */
#ecran-connexion{min-height:100%;display:grid;place-items:center;padding:24px;
  background:radial-gradient(120% 90% at 20% 0%,#0E5A63 0%,#073E45 48%,#04222A 100%)}
.boite-connexion{width:100%;max-width:380px;background:var(--surface);border-radius:var(--r-3);padding:34px 30px;box-shadow:var(--ombre-3)}
.marque{display:flex;align-items:center;gap:9px;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:22px}
.marque svg{width:26px;height:26px;color:var(--p)}
.boite-connexion h1{font-size:15px;font-weight:600;color:var(--text-2);margin:6px 0 24px}
.champ{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.champ label{font-size:12.5px;font-weight:700;color:var(--text-2)}
.saisie{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--r-1);background:var(--surface);min-height:44px;transition:border-color .15s}
.saisie:focus{outline:none;border-color:var(--p);box-shadow:var(--anneau)}
textarea.saisie{min-height:88px;resize:vertical;line-height:1.5}
.erreur-connexion{color:var(--rouge);font-size:13px;margin-top:10px;display:none}
.erreur-connexion.visible{display:block}

/* ── Boutons ────────────────────────────────────────────────────────────── */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:9px 16px;border-radius:var(--r-1);
  font-weight:700;font-size:13.5px;background:var(--p);color:#fff;border:1.5px solid transparent;transition:transform .12s var(--ease),background .15s,opacity .15s;white-space:nowrap}
.btn:hover{background:var(--p-medium)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.large{width:100%}
.btn.second{background:var(--surface);color:var(--text);border-color:var(--border-fort)}
.btn.second:hover{background:var(--surface-alt)}
.btn.danger{background:var(--rouge);color:#fff}
.btn.danger:hover{filter:brightness(.92);background:var(--rouge)}
.btn.vert{background:var(--vert);color:#fff}
.btn.vert:hover{filter:brightness(.93);background:var(--vert)}
.btn.discret{background:transparent;color:var(--p);padding:6px 10px;min-height:34px}
.btn.discret:hover{background:var(--brume)}
.btn.mini{min-height:32px;padding:5px 11px;font-size:12.5px}
@media (prefers-color-scheme: dark){ .btn{color:#062E34} .btn.second,.btn.discret{color:var(--text)} .btn.danger,.btn.vert{color:#08151A} }

/* ── Coquille ───────────────────────────────────────────────────────────── */
#console{display:grid;grid-template-columns:var(--barre) 1fr;min-height:100%}
.barre-laterale{background:var(--p-profond);color:#D7E9EA;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 12px}
.barre-laterale .marque{color:#fff;padding:2px 10px 18px;font-size:20px}
.barre-laterale .marque svg{color:#7FD0D4}
.barre-laterale .marque small{font-family:'Plus Jakarta Sans',sans-serif;font-size:11.5px;font-weight:600;color:#8FB5B8;margin-left:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-1);color:#C3DADB;text-decoration:none;font-weight:600;font-size:13.5px}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.actif{background:rgba(127,208,212,.16);color:#fff}
.nav a.actif svg{color:#7FD0D4}
.nav .compte{margin-left:auto;min-width:22px;height:20px;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;
  background:#F5C542;color:#062E34}
.nav .compte:empty{display:none}
.nav .groupe{font-size:11.5px;font-weight:700;color:#7FA3A6;padding:16px 11px 6px}
.pied-barre{margin-top:auto;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#8FB5B8}
.etat-serveur{display:flex;gap:8px;align-items:flex-start;line-height:1.45;margin-bottom:10px}
.etat-serveur .pastille-etat{width:8px;height:8px;border-radius:50%;background:#34D399;margin-top:5px;flex-shrink:0}
.etat-serveur.alerte .pastille-etat{background:#F5C542}
.etat-serveur.ko .pastille-etat{background:#F87171}
.pied-barre button{color:#C3DADB;display:flex;align-items:center;gap:8px;font-weight:600;padding:6px 0}
.pied-barre button:hover{color:#fff}

.principal{min-width:0;display:flex;flex-direction:column}
.entete-vue{display:flex;align-items:center;gap:14px;padding:22px 32px 16px;position:sticky;top:0;z-index:5;background:var(--bg)}
.entete-vue h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:26px;letter-spacing:-.015em}
.entete-vue .sous{color:var(--gray);font-size:13px;margin-top:2px}
.entete-vue .outils{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn-menu{display:none}
.contenu{padding:4px 32px 48px;max-width:1440px;width:100%}

/* ── Éléments communs ───────────────────────────────────────────────────── */
.panneau{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2)}
.panneau + .panneau{margin-top:16px}
.panneau-tete{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.panneau-tete h2{font-size:14.5px;font-weight:700}
.panneau-tete .petit{margin-left:auto}
.panneau-corps{padding:16px 18px}
.titre-bloc{font-size:13px;font-weight:700;color:var(--text-2);margin:22px 0 10px}
.titre-bloc:first-child{margin-top:0}

.puce{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;
  background:var(--surface-alt);color:var(--text-2)}
.puce.vert{background:var(--vert-clair);color:var(--vert)}
.puce.rouge{background:var(--rouge-clair);color:var(--rouge)}
.puce.ambre{background:var(--ambre-clair);color:var(--ambre)}
.puce.teal{background:var(--brume);color:var(--p)}
.puce.indigo{background:var(--indigo-clair);color:var(--indigo)}
.puce svg{width:13px;height:13px}

.filtres{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center}
.filtre{padding:7px 13px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);font-weight:600;font-size:13px;color:var(--text-2);min-height:36px}
.filtre:hover{border-color:var(--border-fort)}
.filtre.actif{background:var(--p-profond);border-color:var(--p-profond);color:#fff}
@media (prefers-color-scheme: dark){ .filtre.actif{background:var(--p);border-color:var(--p);color:#062E34} }
.recherche{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-1);padding:0 12px;min-height:40px;min-width:260px}
.recherche:focus-within{border-color:var(--p);box-shadow:var(--anneau)}
.recherche input{border:none;outline:none;background:transparent;flex:1;min-height:38px}
.barre-outils{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.barre-outils .filtres{margin:0}
.barre-outils .droite{margin-left:auto}

/* Tableaux */
.tableau-conteneur{overflow-x:auto}
table.tableau{width:100%;border-collapse:collapse;font-size:13.5px}
.tableau th{text-align:left;font-size:12px;font-weight:700;color:var(--gray);padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
.tableau td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tableau tr:last-child td{border-bottom:none}
.tableau tr.cliquable{cursor:pointer}
.tableau tr.cliquable:hover td{background:var(--surface-alt)}
.tableau td.droite,.tableau th.droite{text-align:right}
.tableau .secondaire{display:block;font-size:12px;color:var(--gray);margin-top:1px}
.tableau .actions-ligne{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.actions-ligne .btn{text-align:center}
.pagination{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid var(--border)}

/* Liste ↔ détail */
.scinde{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start}
.liste-file{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);overflow:hidden;position:sticky;top:84px;max-height:calc(100vh - 100px);overflow-y:auto}
.element-file{display:block;width:100%;text-align:left;padding:13px 16px;border-bottom:1px solid var(--border);border-left:3px solid transparent}
.element-file:last-child{border-bottom:none}
.element-file:hover{background:var(--surface-alt)}
.element-file.actif{background:var(--brume);border-left-color:var(--p)}
.element-file .l1{display:flex;align-items:center;gap:8px;font-weight:700}
.element-file .l1 .droite{margin-left:auto}
.element-file .l2{font-size:12.5px;color:var(--gray);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.detail-vide{display:grid;place-items:center;text-align:center;min-height:320px;color:var(--gray);padding:30px}

/* États vides et chargement */
.vide{text-align:center;padding:44px 20px;color:var(--gray)}
.vide svg{width:30px;height:30px;color:var(--p);margin-bottom:10px}
.vide .gros{font-weight:700;color:var(--text);font-size:15px;margin-bottom:4px}
.squelette{height:52px;border-radius:var(--r-1);background:linear-gradient(90deg,var(--surface-alt),var(--surface),var(--surface-alt));background-size:200% 100%;animation:chargement 1.2s infinite linear;margin:10px 0}
@keyframes chargement{to{background-position:-200% 0}}

/* ── Tableau de bord ────────────────────────────────────────────────────── */
.file-a-traiter{display:flex;flex-direction:column}
.ligne-a-traiter{text-decoration:none;color:inherit;display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);text-align:left;width:100%}
.ligne-a-traiter:last-child{border-bottom:none}
.ligne-a-traiter:hover{background:var(--surface-alt)}
.ligne-a-traiter .n{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;color:var(--gray)}
.ligne-a-traiter.urgent .n{color:var(--rouge)}
.ligne-a-traiter.attention .n{color:var(--ambre)}
.ligne-a-traiter .t{font-weight:700}
.ligne-a-traiter .d{font-size:12.5px;color:var(--gray)}
.ligne-a-traiter.calme{opacity:.75}
.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface);overflow:hidden}
.chiffre{padding:16px 18px;border-right:1px solid var(--border)}
.chiffre:last-child{border-right:none}
.chiffre .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.chiffre .e{font-size:12.5px;color:var(--gray)}
.sante{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r-2);overflow:hidden}
.sante > div{background:var(--surface);padding:16px 18px}
.sante .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.sante .v.bon{color:var(--vert)} .sante .v.moyen{color:var(--ambre)} .sante .v.mauvais{color:var(--rouge)}
.sante .e{font-weight:700;font-size:13px;margin-top:2px}
.sante .a{font-size:12px;color:var(--gray);margin-top:4px}
.deux-colonnes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.motif{display:grid;grid-template-columns:1fr 44px;gap:10px;align-items:center;padding:6px 0}
.motif .barre{height:6px;border-radius:3px;background:var(--surface-alt);margin-top:5px;overflow:hidden}
.motif .barre div{height:100%;background:var(--p);border-radius:3px}
.motif .nb{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* ── Litiges : la balance ───────────────────────────────────────────────── */
.origine{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-1);font-size:13.5px;margin-bottom:16px;line-height:1.5}
.origine.contestation{background:var(--rouge-clair);color:var(--rouge)}
.origine.sans_arrivee{background:var(--ambre-clair);color:var(--ambre)}
.origine.reclamation{background:var(--indigo-clair);color:var(--indigo)}
.origine svg{margin-top:2px}
.origine em{display:block;color:var(--text);margin-top:6px}
.balance{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:var(--r-2);overflow:hidden}
.balance .partie{padding:16px 18px}
.balance .partie + .partie{border-left:1px solid var(--border)}
.balance .role{font-size:12px;font-weight:700;color:var(--gray);display:flex;align-items:center;gap:6px}
.balance .nom{font-size:16px;font-weight:800;margin:4px 0 2px}
.balance .ligne{font-size:13px;color:var(--text-2);margin-top:4px}
.preuves{border:1px solid var(--border);border-radius:var(--r-2);margin-top:16px;overflow:hidden}
.preuve{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start;padding:11px 16px;border-bottom:1px solid var(--border)}
.preuve:last-child{border-bottom:none}
.preuve .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.preuve.oui .ic{background:var(--vert-clair);color:var(--vert)}
.preuve.non .ic{background:var(--surface-alt);color:var(--gray)}
.preuve.non{color:var(--gray)}
.preuve .ic svg{width:13px;height:13px}
.montants{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);border-radius:var(--r-2);margin-top:16px;overflow:hidden}
.montants > div{padding:12px 16px;border-right:1px solid var(--border)}
.montants > div:last-child{border-right:none}
.montants .v{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.montants .e{font-size:12px;color:var(--gray)}
.fil{margin-top:16px}
.evt{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:9px 0;border-top:1px dashed var(--border);font-size:13px}
.evt:first-child{border-top:none}
.evt .quand{color:var(--gray);font-size:12px}
.decision{margin-top:22px;border:2px solid var(--p);border-radius:var(--r-2);padding:18px}
.decision h3{font-size:15px;font-weight:800;margin-bottom:12px}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.option{position:relative;display:flex;flex-direction:column;gap:4px;padding:13px 14px 13px 40px;border:1.5px solid var(--border);border-radius:var(--r-1);cursor:pointer;background:var(--surface)}
.option input{position:absolute;left:14px;top:15px;accent-color:var(--p);width:16px;height:16px}
.option .t{font-weight:700}
.option .d{font-size:12.5px;color:var(--gray)}
.option:has(input:checked){border-color:var(--p);background:var(--brume)}
.option.desactivee{opacity:.45;cursor:not-allowed}
.case{display:flex;gap:9px;align-items:flex-start;font-size:13px;margin:12px 0}
.case input{margin-top:3px;width:16px;height:16px;accent-color:var(--p)}

/* ── Documents ──────────────────────────────────────────────────────────── */
.piece{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.piece:last-child{border-bottom:none}
.piece .t{font-weight:700}
.piece.manque .t{color:var(--gray);font-weight:600}
.controle{padding:12px 14px;border-radius:var(--r-1);font-size:13px;line-height:1.5;margin-bottom:14px}
.controle.ok{background:var(--vert-clair)}
.controle.souci{background:var(--ambre-clair)}
.visionneuse{display:grid;grid-template-columns:1fr 320px;gap:0;height:min(80vh,760px)}
.visionneuse .scene{background:#0B1D21;display:grid;place-items:center;overflow:auto;position:relative}
.visionneuse .scene img{max-width:100%;max-height:100%;transition:transform .2s var(--ease);transform-origin:center}
.visionneuse .scene .outils-image{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(6,46,52,.85);padding:6px;border-radius:999px}
.visionneuse .scene .outils-image button{color:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.visionneuse .scene .outils-image button:hover{background:rgba(255,255,255,.12)}
.visionneuse .scene .pdf{color:#fff;text-align:center;padding:30px}
.visionneuse .cote{padding:18px;overflow-y:auto;border-left:1px solid var(--border);display:flex;flex-direction:column;gap:12px}
.visionneuse .cote .actions{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px}
.raccourcis{font-size:12px;color:var(--gray)}
kbd{font-family:inherit;font-size:11.5px;border:1px solid var(--border-fort);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}

/* ── Tiroir et modale ───────────────────────────────────────────────────── */
.voile{position:fixed;inset:0;background:rgba(4,34,42,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.voile.visible{opacity:1;pointer-events:auto}
.tiroir{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);z-index:41;box-shadow:var(--ombre-3);transform:translateX(100%);transition:transform .28s var(--ease);display:flex;flex-direction:column}
.tiroir.ouvert{transform:none}
.tiroir-tete{display:flex;align-items:flex-start;gap:12px;padding:20px 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.tiroir-tete h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:21px}
.tiroir-tete .fermer{margin-left:auto}
.tiroir-corps{padding:18px 24px 40px;overflow-y:auto;flex:1}
.fiche{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13.5px}
.fiche dt{color:var(--gray)}
.fiche dd{font-weight:600;min-width:0;overflow-wrap:anywhere}
.modale{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;pointer-events:none}
.modale .boite{pointer-events:auto;background:var(--surface);border-radius:var(--r-3);box-shadow:var(--ombre-3);width:100%;max-width:520px;max-height:92vh;overflow:auto;transform:translateY(10px) scale(.98);opacity:0;transition:transform .22s var(--ease),opacity .18s}
.modale.large .boite{max-width:1100px;overflow:hidden}
.modale.visible .boite{transform:none;opacity:1}
/* Fermée, la boîte ne doit plus rien intercepter (elle restait cliquable, invisible). */
.modale:not(.visible) .boite{pointer-events:none;visibility:hidden;transition:transform .22s var(--ease),opacity .18s,visibility 0s .22s}
.modale .tete{padding:20px 22px 0;display:flex;gap:12px;align-items:flex-start}
.modale .tete h3{font-size:17px;font-weight:800}
.modale .corps{padding:12px 22px 4px}
.modale .pied{padding:16px 22px 20px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.consequence{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-1);background:var(--surface-alt);font-size:13.5px;line-height:1.55;margin-bottom:14px}
.consequence.danger{background:var(--rouge-clair)}
.consequence.argent{background:var(--ambre-clair)}
.consequence svg{margin-top:2px}

/* Messages */
.avis{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--p-profond);color:#fff;padding:12px 18px;border-radius:var(--r-1);
  font-weight:600;font-size:13.5px;z-index:80;transition:all .25s var(--ease);max-width:min(560px,calc(100% - 32px));box-shadow:var(--ombre-2);display:flex;gap:9px;align-items:center}
.avis.visible{opacity:1;transform:translateX(-50%)}
.avis.ko{background:#8A1C14}
.avis.attention{background:#6B4505}

.messages{display:flex;flex-direction:column;gap:6px}
.bulle{max-width:85%;padding:8px 12px;border-radius:12px;font-size:13px;background:var(--surface);border:1px solid var(--border)}
.bulle.pro{align-self:flex-end;background:var(--brume);border-color:var(--brume-2)}
.bulle.systeme{align-self:center;background:transparent;border:none;color:var(--gray);font-size:12px;text-align:center}
.bulle .q{font-size:11px;color:var(--gray);margin-top:3px}

.annees{display:flex;gap:6px;margin-bottom:12px}
.sequence{padding:12px 14px;border-radius:var(--r-1);margin-bottom:14px;font-size:13.5px}
.sequence.ok{background:var(--vert-clair)} .sequence.souci{background:var(--rouge-clair)}
.rappel{font-size:12.5px;color:var(--text-2);background:var(--surface-alt);border-radius:var(--r-1);padding:12px 14px;line-height:1.6;margin-bottom:14px}

/* ── Écrans moyens et petits ────────────────────────────────────────────── */
@media (max-width:1100px){
  .scinde{grid-template-columns:1fr}
  .liste-file{position:static;max-height:none}
  .options{grid-template-columns:1fr}
  .visionneuse{grid-template-columns:1fr;height:auto}
  .visionneuse .scene{height:52vh}
  .visionneuse .cote{border-left:none;border-top:1px solid var(--border)}
}
@media (max-width:860px){
  #console{grid-template-columns:1fr}
  .barre-laterale{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:50;transform:translateX(-100%);transition:transform .25s var(--ease)}
  .barre-laterale.ouverte{transform:none;box-shadow:var(--ombre-3)}
  .btn-menu{display:inline-flex}
  .entete-vue{padding:14px 16px 10px}
  .entete-vue h1{font-size:21px}
  .entete-vue .sous{display:none}
  .sante{grid-template-columns:1fr 1fr}
  .contenu{padding:4px 16px 40px}
  .deux-colonnes,.balance,.montants{grid-template-columns:1fr}
  .balance .partie + .partie{border-left:none;border-top:1px solid var(--border)}
  .montants > div{border-right:none;border-bottom:1px solid var(--border)}
  .chiffre{border-right:none;border-bottom:1px solid var(--border)}
  .recherche{min-width:0;flex:1}
  .fiche{grid-template-columns:1fr}
  .fiche dt{margin-top:6px}
  .tableau .masquable{display:none}
  .piece{grid-template-columns:1fr auto}
  .piece > .actions-ligne{grid-column:1 / -1;align-items:stretch!important}
  .actions-ligne .btn{white-space:normal}
  .evt{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>

<!-- ═══ CONNEXION ═══════════════════════════════════════════════════════ -->
<div id="ecran-connexion">
  <div class="boite-connexion">
    <div class="marque"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 12 C58 26 65 37 68 44 C70 49 71 53 71 57 C71 69 62 78 50 78 C38 78 29 69 29 57 C29 53 30 49 32 44 C35 37 42 26 50 12 Z" fill="currentColor"/></svg>Gleam</div>
    <h1>Console d'administration</h1>
    <div class="champ">
      <label for="mdp">Mot de passe administrateur</label>
      <input class="saisie" type="password" id="mdp" autocomplete="current-password">

<!-- ═══ CONSOLE ═════════════════════════════════════════════════════════ -->
<div id="console" class="masque">
  <aside class="barre-laterale" id="barre-laterale">
    <div class="marque"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 12 C58 26 65 37 68 44 C70 49 71 53 71 57 C71 69 62 78 50 78 C38 78 29 69 29 57 C29 53 30 49 32 44 C35 37 42 26 50 12 Z" fill="currentColor"/></svg>Gleam <small>admin</small></div>
    <nav class="nav" aria-label="Sections">
      <a href="#tableau" data-vue="tableau"><i data-lucide="layout-dashboard"></i>Tableau de bord</a>
      <div class="groupe">À décider</div>
      <a href="#litiges" data-vue="litiges"><i data-lucide="scale"></i>Litiges<span class="compte" id="c-litiges"></span></a>
      <a href="#documents" data-vue="documents"><i data-lucide="file-check-2"></i>Documents<span class="compte" id="c-documents"></span></a>
      <a href="#signalements" data-vue="signalements"><i data-lucide="flag"></i>Signalements<span class="compte" id="c-signalements"></span></a>
      <a href="#paiements" data-vue="paiements"><i data-lucide="credit-card"></i>Paiements<span class="compte" id="c-paiements"></span></a>
      <div class="groupe">Suivre</div>
      <a href="#demandes" data-vue="demandes"><i data-lucide="clipboard-list"></i>Demandes</a>
      <a href="#comptes" data-vue="comptes"><i data-lucide="users"></i>Comptes</a>
      <a href="#fiscalite" data-vue="fiscalite"><i data-lucide="landmark"></i>Fiscalité</a>
    </nav>
    <div class="pied-barre">
      <div class="etat-serveur" id="etat-serveur"><span class="pastille-etat"></span><span id="texte-serveur">Serveur…</span></div>
      <button id="btn-sortir"><i data-lucide="log-out"></i>Se déconnecter</button>
    </div>
  </aside>

  <div class="principal">
    <header class="entete-vue">
      <button class="btn second mini btn-menu" id="btn-menu" aria-label="Ouvrir le menu"><i data-lucide="menu"></i></button>
      <div>
        <h1 id="titre-vue">Tableau de bord</h1>
        <div class="sous" id="sous-titre-vue"></div>
      </div>
      <div class="outils">
        <button class="btn second mini" id="btn-actualiser"><i data-lucide="refresh-cw"></i>Actualiser</button>
      </div>
    </header>
    <main class="contenu" id="contenu" tabindex="-1"></main>
  </div>
</div>

<div class="voile" id="voile"></div>
<aside class="tiroir" id="tiroir" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="tiroir-tete"><div id="tiroir-titre"></div><button class="btn second mini fermer" data-action="fermer-tiroir" aria-label="Fermer"><i data-lucide="x"></i></button></div>
  <div class="tiroir-corps" id="tiroir-corps"></div>
</aside>
<div class="modale" id="modale" role="dialog" aria-modal="true" aria-labelledby="modale-titre"><div class="boite" id="modale-boite"></div></div>
<div class="avis" id="avis" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<script>
'use strict';
/* ============================================================================
   CONSOLE D'ADMINISTRATION GLEAM
   Toutes les données affichées passent par echapper(). Aucune donnée
   d'utilisateur n'est placée dans un onclick : les actions passent par
   data-action + data-* et un seul gestionnaire délégué.
   ============================================================================ */
const API = 'https://gleam-production-9b95.up.railway.app';
const CLE_JETON = 'gleam_admin_jeton';
let jeton = null;
try { jeton = sessionStorage.getItem(CLE_JETON); } catch (e) {}
const $ = (id) => document.getElementById(id);

// ── Mise en forme ──────────────────────────────────────────────────────────
function echapper(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
const nf = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' });
const euros = (n) => nf.format(Number(n) || 0);
function dateFr(iso, avecHeure) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return echapper(iso);
  const j = d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
  return avecHeure ? j + ', ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : j;
}
function ilYA(iso) {
  if (!iso) return '';
  const min = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return "à l'instant";
  if (min < 60) return 'il y a ' + min + ' min';
  const h = Math.floor(min / 60);
  if (h < 24) return 'il y a ' + h + ' h';
  const j = Math.floor(h / 24);
  return 'il y a ' + j + ' j';
}
function creneauFr(c) {
  const m = /(\d{4})-(\d{2})-(\d{2})\s*à\s*(\d{1,2})[h:](\d{2})/.exec(c || '');
  if (!m) return c ? echapper(c) : 'Sans date';
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }) + ' à ' + m[4] + 'h' + m[5];
}
const PRESTATIONS = { voiture: 'Voiture', canape: 'Canapé', matelas: 'Matelas', terrasse: 'Terrasse', piscine: 'Piscine',
  toiture: 'Toiture', vitres: 'Vitres', tapis: 'Tapis', autre: 'Autre' };
function prestationFr(p) {
  if (!p) return 'Prestation';
  return String(p).split(' + ').map((x) => {
    const m = /^(\d+)\s+(.+)$/.exec(x.trim());
    return m ? m[1] + ' × ' + (PRESTATIONS[m[2]] || m[2]) : (PRESTATIONS[x.trim()] || x.trim());
  }).join(' + ');
}
const villeDe = (a) => { const t = String(a || '').split(',').map((x) => x.trim()).filter(Boolean); return t.length ? t[t.length - 1] : ''; };
const nomDe = (u) => u ? (((u.prenom || '') + ' ' + (u.nom || '')).trim() || u.email || 'Sans nom') : '—';

const STATUT_DEMANDE = {
  en_attente: ['Sans devis', 'ambre'], devis_recus: ['Devis reçus', 'teal'], acceptee: ['Acceptée, à payer', 'indigo'],
  en_cours: ['Payée, à réaliser', 'teal'], terminee: ['Terminée', 'vert'], annulee_client: ['Annulée', ''],
  expiree: ['Expirée', ''], refuse: ['Refusée', '']
};
const STATUT_PAIEMENT = {
  en_attente: ['Non finalisé', ''], en_cours: ['En cours', ''], paye: ['Encaissé', 'teal'],
  liberation_en_cours: ['Versement en cours', 'ambre'], libere: ['Versé au prestataire', 'vert'],
  rembourse: ['Remboursé', 'indigo'], rembourse_partiel: ['Remboursé en partie', 'indigo'],
  bloque: ['Bloqué — opposition', 'rouge'], remboursement_en_cours: ['Remboursement en cours', 'ambre']
};
const STATUT_DEVIS = { envoye: ['Envoyé', ''], accepte: ['Accepté', 'vert'], refuse: ['Refusé', ''], annule_pro: ['Retiré', ''],
  annule_client: ['Annulé', ''], expire: ['Expiré', ''], expire_sans_paiement: ['Expiré sans paiement', ''] };
const STATUT_DOC = { en_attente: ['À vérifier', 'ambre'], valide: ['Validé', 'vert'], refuse: ['Refusé', 'rouge'] };
function puce(table, cle) {
  const v = table[cle] || [cle || '—', ''];
  return '<span class="puce ' + v[1] + '">' + echapper(v[0]) + '</span>';
}
const ic = (nom) => '<i data-lucide="' + nom + '"></i>';
function icones() { try { if (window.lucide) window.lucide.createIcons(); } catch (e) {} }

// ── Messages éphémères ─────────────────────────────────────────────────────
function avis(message, ton) {
  const a = $('avis');
  a.className = 'avis visible ' + (ton || '');
  a.innerHTML = ic(ton === 'ko' ? 'circle-alert' : ton === 'attention' ? 'triangle-alert' : 'circle-check') + '<span>' + echapper(message) + '</span>';
  icones();
  clearTimeout(a._t);
  a._t = setTimeout(() => a.classList.remove('visible'), ton === 'ko' || ton === 'attention' ? 6500 : 3600);
}

// ── Appels au serveur ──────────────────────────────────────────────────────
let dernierEnTete = {};
async function appel(chemin, options) {
  const r = await fetch(API + chemin, Object.assign({}, options, {
    headers: Object.assign({ 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + jeton },
                           (options && options.headers) || {})
  }));
  if (r.status === 401) { deconnecter('Session expirée, reconnectez-vous.'); throw Object.assign(new Error('401'), { silencieux: true }); }
  const d = await r.json().catch(() => ({}));
  dernierEnTete = { total: parseInt(r.headers.get('X-Total-Comptes') || '0', 10) };
  if (!r.ok) throw Object.assign(new Error(d.error || ('Erreur ' + r.status)), { statut: r.status, corps: d });
  return d;
}
const envoyer = (chemin, methode, corps) => appel(chemin, { method: methode, body: JSON.stringify(corps || {}) });
function erreurBloc(e) {
  if (e && e.silencieux) return '';
  const route404 = e && e.statut === 404;
  return '<div class="vide">' + ic('cloud-off') + '<div class="gros">Chargement impossible</div>'
    + echapper(e && e.message) + (route404 ? '<br>Le serveur n\'est peut-être pas à jour : déployez le dernier server.js.' : '') + '</div>';
}

// ── Connexion ──────────────────────────────────────────────────────────────
async function connecter() {
  const mdp = $('mdp').value, err = $('erreur-connexion');
  err.classList.remove('visible');
  if (!mdp) { err.textContent = 'Saisissez le mot de passe.'; err.classList.add('visible'); return; }
  const b = $('btn-entrer'); b.disabled = true; b.textContent = 'Connexion…';
  try {
    const r = await fetch(API + '/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: mdp }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { err.textContent = d.error || 'Mot de passe incorrect.'; err.classList.add('visible'); return; }
    jeton = d.token;
    try { sessionStorage.setItem(CLE_JETON, jeton); } catch (e) {}
    $('mdp').value = '';
    entrer();
  } catch (e) {
    err.textContent = 'Impossible de joindre le serveur. Vérifiez votre connexion.'; err.classList.add('visible');
  } finally { b.disabled = false; b.textContent = 'Se connecter'; }
}
function deconnecter(message) {
  jeton = null;
  try { sessionStorage.removeItem(CLE_JETON); } catch (e) {}
  clearInterval(minuteurCompteurs);
  $('console').classList.add('masque');
  $('ecran-connexion').classList.remove('masque');
  fermerTiroir(); fermerModale(null);
  if (message) avis(message, 'ko');
}
let minuteurCompteurs = null;
function entrer() {
  $('ecran-connexion').classList.add('masque');
  $('console').classList.remove('masque');
  icones();
  chargerCompteurs(); chargerEtatServeur();
  clearInterval(minuteurCompteurs);
  minuteurCompteurs = setInterval(chargerCompteurs, 60000);
  naviguer();
}

// ── Pastilles « à traiter » ────────────────────────────────────────────────
let compteurs = null;
async function chargerCompteurs() {
  try {
    compteurs = await appel('/api/admin/a-traiter');
    ['litiges', 'documents', 'signalements', 'paiements'].forEach((k) => { $('c-' + k).textContent = compteurs[k] ? String(compteurs[k]) : ''; });
  } catch (e) { compteurs = null; }
}
async function chargerEtatServeur() {
  const bloc = $('etat-serveur'), t = $('texte-serveur');
  try {
    const v = await appel('/api/admin/version');
    const alertes = [];
    if (v.stripe === 'test') alertes.push('Stripe en mode test');
    else if (v.stripe === 'absente') alertes.push('clé Stripe absente');
    else if (v.stripe_coherent === false) alertes.push('clés Stripe incohérentes');
    if (v.routes_recentes && v.routes_recentes.console_admin === false) alertes.push('serveur à mettre à jour');
    if (v.routes_recentes && !('console_admin' in v.routes_recentes)) alertes.push('serveur à mettre à jour');
    if (v.cloture_planifiee === false) alertes.push('clôture automatique absente');
    t.textContent = 'Serveur v' + v.version + (alertes.length ? ' — ' + alertes.join(', ') : ' — opérationnel');
    bloc.className = 'etat-serveur' + (alertes.length ? ' alerte' : '');
  } catch (e) {
    if (e.silencieux) return;
    t.textContent = 'Serveur injoignable'; bloc.className = 'etat-serveur ko';
  }
}

// ── Navigation ─────────────────────────────────────────────────────────────
const VUES = {
  tableau:      { titre: 'Tableau de bord', sous: 'Ce qui attend une décision, puis l\'état du service.', charger: () => vueTableau() },
  litiges:      { titre: 'Litiges', sous: 'L\'argent est gelé jusqu\'à votre décision : ni versé, ni remboursé.', charger: () => vueLitiges() },
  documents:    { titre: 'Documents des prestataires', sous: 'Un prestataire ne reçoit des demandes qu\'une fois toutes ses pièces validées.', charger: () => vueDocuments() },
  signalements: { titre: 'Signalements', sous: 'Un signalement ouvert suspend le versement au prestataire de cette prestation.', charger: () => vueSignalements() },
  paiements:    { titre: 'Paiements', sous: 'Oppositions bancaires, versements échoués, remboursements.', charger: () => vuePaiements() },
  demandes:     { titre: 'Demandes', sous: 'Toutes les demandes des clients, de la publication au paiement.', charger: () => vueDemandes() },
  comptes:      { titre: 'Comptes', sous: 'Clients, entreprises et prestataires.', charger: () => vueComptes() },
  fiscalite:    { titre: 'Fiscalité', sous: 'Déclaration DAC7, chiffre d\'affaires et factures émises.', charger: () => vueFiscalite() }
};
let vueCourante = 'tableau';
function naviguer() {
  const v = (location.hash || '#tableau').slice(1).split('/')[0];
  vueCourante = VUES[v] ? v : 'tableau';
  document.querySelectorAll('.nav a').forEach((a) => {
    const actif = a.dataset.vue === vueCourante;
    a.classList.toggle('actif', actif);
    if (actif) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  $('titre-vue').textContent = VUES[vueCourante].titre;
  $('sous-titre-vue').textContent = VUES[vueCourante].sous;
  $('barre-laterale').classList.remove('ouverte');
  $('contenu').innerHTML = '<div class="squelette"></div>'.repeat(4);
  VUES[vueCourante].charger();
}
window.addEventListener('hashchange', () => { if (jeton) naviguer(); });
function rafraichir() { chargerCompteurs(); VUES[vueCourante].charger(); }

// ═══════════════════════════════════════════════════════════════════════════
// MODALE DE CONFIRMATION
// Toute action qui engage de l'argent ou l'accès d'une personne passe par ici :
// la conséquence écrite en clair, un motif quand il est exigé, et une case à
// cocher pour les actions irréversibles.
// ═══════════════════════════════════════════════════════════════════════════
let resoudreModale = null;
function ouvrirModale(o) {
  const champs = [];
  if (o.montant) champs.push('<div class="champ"><label for="m-montant">' + echapper(o.montant.libelle) + '</label>'
    + '<input class="saisie num" id="m-montant" inputmode="decimal" value="' + echapper(o.montant.valeur) + '">'
    + (o.montant.aide ? '<span class="petit">' + echapper(o.montant.aide) + '</span>' : '') + '</div>');
  if (o.choix) champs.push('<div class="champ"><label for="m-choix">' + echapper(o.choix.libelle) + '</label><select class="saisie" id="m-choix">'
    + o.choix.options.map((x) => '<option value="' + echapper(x[0]) + '">' + echapper(x[1]) + '</option>').join('') + '</select></div>');
  if (o.motif) champs.push('<div class="champ"><label for="m-motif">' + echapper(o.motif.libelle || 'Motif') + (o.motif.requis ? '' : ' (facultatif)') + '</label>'
    + '<textarea class="saisie" id="m-motif" maxlength="1000" placeholder="' + echapper(o.motif.indice || '') + '"></textarea>'
    + (o.motif.aide ? '<span class="petit">' + echapper(o.motif.aide) + '</span>' : '') + '</div>');
  if (o.verification) champs.push('<label class="case"><input type="checkbox" id="m-verif"><span>' + echapper(o.verification) + '</span></label>');
  $('modale-boite').innerHTML =
    '<div class="tete"><h3 id="modale-titre">' + echapper(o.titre) + '</h3></div>'
    + '<div class="corps">'
    + (o.consequence ? '<div class="consequence ' + (o.ton || '') + '">' + ic(o.ton === 'danger' ? 'octagon-alert' : o.ton === 'argent' ? 'banknote' : 'info') + '<div>' + o.consequence + '</div></div>' : '')
    + (o.html || '') + champs.join('') + '<div class="erreur-connexion" id="m-erreur" role="alert"></div></div>'

// ── Exécuter une action et en rendre compte ────────────────────────────────
async function executer(promesse, apres) {
  try {
    const r = await promesse;
    avis((r && r.message) || 'Enregistré.');
    chargerCompteurs();
    if (apres) apres(r);
    return r;
  } catch (e) {
    if (e.silencieux) return null;
    if (e.corps && e.corps.decision_enregistree) { avis(e.message, 'attention'); chargerCompteurs(); if (apres) apres(null); return null; }
    avis(e.message, 'ko');
    return null;
  }
}

async function chargerDossier() {
  const p = dossiers.find((x) => x.pro_id === dossierChoisi);

    const d = await appel('/api/admin/documents?pro_id=' + encodeURIComponent(p.pro_id));
    motifsRefus = d.motifs_refus || motifsRefus;
    // La pièce la plus récente de chaque type/face fait foi.
    const parCle = {};
    (d.documents || []).forEach((doc) => { const k = doc.type + '|' + (doc.face || 'unique'); if (!parCle[k] || new Date(doc.created_at) > new Date(parCle[k].created_at)) parCle[k] = doc; });
    docsDossier = Object.values(parCle).sort((a, b) => (a.statut === 'en_attente' ? 0 : 1) - (b.statut === 'en_attente' ? 0 : 1));
    proDossier = (d.documents && d.documents[0] && d.documents[0].pro) || null;
    dessinerDossier(p);
  } catch (e) { z.innerHTML = erreurBloc(e); icones(); }
}
function blocSiret(pro) {

  else if (pro.siret_statut === 'ferme') t = '<strong>Établissement fermé</strong> au répertoire — ' + echapper(d.nom || pro.siret);
  else if (pro.siret_statut === 'introuvable') t = '<strong>SIRET introuvable</strong> au répertoire officiel (' + echapper(pro.siret) + ')';
  else if (!pro.siret) t = '<strong>Aucun SIRET renseigné</strong>';
  else t = 'SIRET ' + echapper(pro.siret) + ' — pas encore vérifié';
  if (pro.siret_doublon) t += '<br><strong>Ce SIRET est utilisé par un autre compte</strong> — à examiner.';

}

let docVisionne = null, rotation = 0, zoom = 1, modeRevue = false;

function appliquerVue() { const img = $('v-image'); if (img) img.style.transform = 'rotate(' + rotation + 'deg) scale(' + zoom + ')'; }
function fermerVisionneuse() {
  docVisionne = null; $('modale').className = 'modale';
  if (!$('tiroir').classList.contains('ouvert')) $('voile').classList.remove('visible');
  if (ongletDocs === 'dossiers' && dossiers.length) { const p = dossiers.find((x) => x.pro_id === dossierChoisi); if (p) dessinerDossier(p); }
}
async function deciderDoc(decision) {
  const doc = docVisionne; if (!doc) return;
  const corps = { decision, date_emission: ($('v-emission') || {}).value || null, date_expiration: ($('v-expiration') || {}).value || null };
  if (decision === 'refuse') {
    const opts = Object.keys(motifsRefus).map((k) => [k, motifsRefus[k]]);
    const r = await ouvrirModale({ titre: 'Refuser cette pièce ?', ton: '', consequence: 'Le prestataire est prévenu par notification et par email, avec le motif. Il devra déposer un nouveau document.',
      choix: { libelle: 'Motif du refus', options: opts.length ? opts : [['autre', 'Autre motif']] },
      motif: { libelle: 'Précision pour le prestataire', requis: false, indice: 'Ex. : la date de validité n\'est pas lisible.' }, confirmer: 'Refuser la pièce' });
    if (!r) { examiner(doc, modeRevue); return; }
    corps.motif = r.choix; corps.commentaire = r.motif;
  }
  const res = await executer(envoyer('/api/admin/documents/' + encodeURIComponent(doc.id), 'PATCH', corps));
  if (!res) { if (decision === 'refuse') examiner(doc, modeRevue); return; }
  doc.statut = decision;
  if (modeRevue) { suivanteRevue(); return; }
  fermerVisionneuse();
  if (ongletDocs === 'dossiers') { await vueDocuments(); } else vueDocuments();
}
function suivanteRevue() {
  indexRevue++;
  while (indexRevue < fileRevue.length && fileRevue[indexRevue].statut !== 'en_attente') indexRevue++;
  if (indexRevue >= fileRevue.length) { fermerVisionneuse(); avis('File terminée.'); vueDocuments(); return; }
  examiner(fileRevue[indexRevue], true);
}

async function basculerSignal(id, statut) {
  const s = signalements.find((x) => x.id === id);
  const r = await ouvrirModale(statut === 'nouveau'
    ? { titre: 'Rouvrir ce signalement ?', consequence: 'Le versement au prestataire de cette prestation est de nouveau suspendu. Si le versement est déjà parti, cela ne le récupère pas.', confirmer: 'Rouvrir' }
    : { titre: statut === 'traite' ? 'Signalement traité ?' : 'Signalement sans objet ?', ton: 'argent',
        consequence: '« ' + echapper(s ? s.motif : '') + ' »<br><br>Le versement au prestataire reprend son cours : il sera payé à la clôture de la prestation. Cela <strong>NE REMBOURSE PAS le client</strong> : pour cela, utilisez l\'onglet Litiges ou Paiements.',
        verification: 'J\'ai pris connaissance du signalement.', confirmer: 'Clore le signalement' });
  if (!r) return;
  const ok = await executer(envoyer('/api/admin/signalements/' + encodeURIComponent(id), 'PATCH', { statut }), () => vueSignalements());
  if (ok) avis(statut === 'nouveau' ? 'Rouvert. Le versement au prestataire est de nouveau suspendu.'
    : statut === 'rejete' ? 'Sans objet. Le prestataire sera payé.' : 'Traité. Le prestataire sera payé.');
}

function pagination(total, page, parPage, action) {

    + '<span class="petit">' + debut + '–' + fin + ' sur ' + total + '</span>'
    + '<button class="btn second mini" data-action="' + action + '" data-id="' + (page + 1) + '"' + (fin >= total ? ' disabled' : '') + '>Suivants</button></div>';

async function rembourser(p, apres) {

  const r = await ouvrirModale({
    titre: 'Rembourser le client', ton: 'danger',
    consequence: 'Le montant est rendu au client sur sa carte (2 à 5 jours). La part du prestataire et la commission Gleam sont reprises au prorata. Un avoir est émis. <strong>Irréversible.</strong>',
    montant: { libelle: 'Montant à rembourser', valeur: String(restant).replace('.', ','), max: restant, aide: 'Il reste ' + euros(restant) + ' remboursables. Un montant inférieur fait un remboursement partiel.' },
    motif: { libelle: 'Motif', requis: true, min: 5, indice: 'Travail non conforme, objet abîmé, geste commercial…', aide: 'Conservé au dossier.' },
    verification: 'Je confirme le remboursement de ce client.', confirmer: 'Rembourser'

async function actionPaiement(type, id) {

  const apres = () => { if (vueCourante === 'paiements') vuePaiements(); if (demandeOuverte) ouvrirDemande(demandeOuverte.demande.id); };

      consequence: 'À faire seulement si l\'opposition bancaire a été <strong>gagnée</strong> (fonds rendus à Gleam par la banque). Le paiement repasse à « encaissé » : le prestataire sera payé par le code de fin ou la clôture automatique.',
      motif: { libelle: 'Motif', requis: true, min: 5, indice: 'Ex. : opposition gagnée le 12/10, référence Stripe du_…' }, verification: 'J\'ai vérifié l\'issue de l\'opposition dans Stripe.', confirmer: 'Débloquer' });
    if (!r) return;

  }
  if (type === 'verser') {

      consequence: (p.pro ? echapper(p.pro) + ' reçoit' : 'Le prestataire reçoit') + ' sa part de <strong>' + euros(p.montant_societe) + '</strong> maintenant. <strong>Irréversible.</strong>',
      motif: { libelle: 'Motif', requis: true, min: 5, indice: 'Ex. : versement échoué, compte Stripe du prestataire corrigé.' }, verification: 'La prestation a bien été réalisée.', confirmer: 'Verser' });
    if (!r) return;
    return executer(envoyer('/api/admin/paiements/' + encodeURIComponent(id) + '/verser', 'POST', { motif: r.motif }), apres);
  }
}

async function basculerCompte(id) {
  if (!compteOuvert || compteOuvert.compte.id !== id) return;
  const u = compteOuvert.compte, reactiver = !!u.suspendu;
  const r = await ouvrirModale(reactiver
    ? { titre: 'Réactiver ' + nomDe(u) + ' ?', ton: 'vert', consequence: 'Le prestataire reçoit de nouveau les demandes de sa zone et peut envoyer des devis. Il est prévenu par notification.', motif: { libelle: 'Motif', requis: false }, confirmer: 'Réactiver' }
    : { titre: 'Suspendre ' + nomDe(u) + ' ?', ton: 'danger', consequence: 'Le prestataire ne reçoit plus aucune demande et ne peut plus envoyer de devis, jusqu\'à réactivation par vous. Il est prévenu par notification. Ses prestations déjà payées ne sont pas annulées.', motif: { libelle: 'Motif de la suspension', requis: true, min: 5, aide: 'Conservé dans l\'historique du compte.' }, verification: 'Je confirme la suspension.', confirmer: 'Suspendre' });
  if (!r) return;
  await executer(envoyer('/api/admin/users/' + encodeURIComponent(id) + '/disponibilite', 'PATCH', { disponible: reactiver, motif: r.motif }), () => { ouvrirCompte(id); if (vueCourante === 'comptes') chargerComptes(); });
}

let donneesExport = null;
function telechargerCsv(lignes, nom) {
  const csv = '\ufeff' + lignes.map((l) => l.map((c) => {
    // Une cellule commençant par = + - @ est une formule pour Excel : neutralisée.
    let v = String(c === null || c === undefined ? '' : c);
    if (/^[=+\-@\t\r]/.test(v) && !/^[-+]?\d+([.,]\d+)?$/.test(v)) v = "'" + v;
    return '"' + v.replace(/"/g, '""') + '"';
  }).join(';')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const lien = document.createElement('a');
  lien.href = url;
  lien.download = nom;
  lien.style.display = 'none';
  // Le lien doit être dans le document pour que Safari le suive.
  document.body.appendChild(lien);
  lien.click();
  document.body.removeChild(lien);
  // Libération différée : le téléchargement doit avoir commencé.
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  avis('Export téléchargé.');
}
function exporter(type) {
  const d = donneesExport; if (!d) return;
  if (type === 'dac7') {
    const l = [['Nom declare', 'Nom officiel repertoire', 'Email', 'Telephone', 'SIRET', 'Adresse', 'Nb operations', 'Revenu brut', 'Commission prelevee', 'Revenu net', 'T1', 'T2', 'T3', 'T4', 'Declarable']];
    d.prestataires.forEach((p) => l.push([p.nom, p.nom_officiel || '', p.email, p.telephone || '', p.siret || '', p.adresse || '', p.nb_operations, p.revenu_brut, p.commission_prelevee, p.revenu_net, p.trimestres.T1, p.trimestres.T2, p.trimestres.T3, p.trimestres.T4, p.declarable ? 'oui' : 'NON']));
    telechargerCsv(l, 'gleam-declaration-' + d.annee + '.csv');
  } else if (type === 'revenus') {
    const l = [['Periode', 'Nb transactions', 'Encaisse', 'Commission Gleam', 'Reverse prestataires']];
    d.par_mois.forEach((m) => l.push([m.nom, m.nb, m.encaisse, m.commission, m.reverse]));
    d.par_trimestre.forEach((t) => l.push([t.trimestre, t.nb, t.encaisse, t.commission, t.reverse]));
    l.push(['TOTAL ' + d.annee, d.total.nb, d.total.encaisse, d.total.commission, d.total.reverse]);
    telechargerCsv(l, 'gleam-revenus-' + d.annee + '.csv');
  } else {
    const l = [['Numero', 'Date', 'Client', 'Prestataire', 'Montant TTC', 'Commission', 'Net prestataire']];
    d.factures.forEach((f) => l.push([f.numero || '', f.date, f.client, f.prestataire, f.montant, f.commission, f.net]));
    telechargerCsv(l, 'gleam-factures-' + d.annee + '.csv');
  }
}

  'annee': (el) => { annee = Number(el.dataset.id); vueFiscalite(); },
  'export': (el) => exporter(el.dataset.id),
  'rembourser-facture': (el) => { const f = facturesCourantes[Number(el.dataset.index)]; if (f) rembourser({ id: f.id, montant_ttc: f.montant, montant_rembourse: f.montant_rembourse }, () => vueFiscalite()); }
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const f = ACTIONS[el.dataset.action];
  if (!f) return;
  if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
  e.stopPropagation();
  f(el, e);
});
$('voile').addEventListener('click', () => { if ($('modale').classList.contains('visible')) { if (docVisionne && !resoudreModale) fermerVisionneuse(); else fermerModale(null); } else { fermerTiroir(); demandeOuverte = null; compteOuvert = null; } });
document.addEventListener('keydown', (e) => {
  const saisie = /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '');
  if (e.key === 'Escape') {
    if ($('modale').classList.contains('visible')) { if (docVisionne && !resoudreModale) fermerVisionneuse(); else fermerModale(null); }
    else if ($('tiroir').classList.contains('ouvert')) fermerTiroir();
    return;
  }
  if (docVisionne && !resoudreModale && !saisie && docVisionne.statut === 'en_attente') {
    if (e.key === 'v' || e.key === 'V') { e.preventDefault(); deciderDoc('valide'); }
    else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); deciderDoc('refuse'); }
    else if (e.key === 't' || e.key === 'T') { rotation = (rotation + 90) % 360; appliquerVue(); }
  }
});
$('btn-entrer').onclick = connecter;
$('mdp').addEventListener('keydown', (e) => { if (e.key === 'Enter') connecter(); });
$('btn-sortir').onclick = () => deconnecter('Vous êtes déconnecté.');
$('btn-actualiser').onclick = rafraichir;
$('btn-menu').onclick = () => $('barre-laterale').classList.toggle('ouverte');

icones();
// Reprise de session : le jeton est vérifié par un vrai appel.
if (jeton) appel('/api/admin/stats').then(entrer).catch(() => deconnecter());
</script>
</body>
</html>
